[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-manager"
version = "0.1.0"
description = "Pantry tracker and recipe recommender (mobile-first PWA)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "itsdangerous>=2.1",  # signed session cookie (Starlette SessionMiddleware)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
