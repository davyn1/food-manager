{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block heading %}Pantry{% endblock %}
{% block content %}
<form class="card login" method="post" action="/login">
  <p class="hint">Sign in to see what’s hiding in your fridge.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username
    <input name="username" type="text" value="{{ username }}" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="primary wide">Sign in</button>
</form>
{% endblock %}
